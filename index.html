<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h1>Restaurant Information Bot</h1>

        <div id="chat-box" class="chat-box">
            <div class="bot-message">
                Hello! I can help with menu, reservations, recommendations, and order tracking.
            </div>
        </div>

        <div class="quick-buttons">
            <button onclick="sendQuickMessage('show menu')">Menu</button>
            <button onclick="sendQuickMessage('recommend something')">Recommend</button>
            <button onclick="sendQuickMessage('reservation amna')">Reservation</button>
            <button onclick="sendQuickMessage('track order 102')">Track Order</button>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message here...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
